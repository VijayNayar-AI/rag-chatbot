<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transformer RAG Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <h1>🤖 Transformer RAG Assistant</h1>

            <p>Ask anything about Transformers</p>

        </div>


        <!-- Chat Messages -->

        <div
            id="chatMessages"
            class="chat-messages"
        >

            <div class="welcome-message">

                <h2>👋 Welcome!</h2>

                <p>
                    Ask me anything about the Transformer architecture.
                </p>

            </div>

        </div>


        <!-- Input Area -->

        <div class="chat-input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask your question..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
